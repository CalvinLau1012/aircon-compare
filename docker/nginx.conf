# 外網域名：HTTP 自動跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name calvin1012.ddns.net;

    return 301 https://$host$request_uri;
}

# 內網 IP / 其他 host：照舊直接 HTTP（方便自己喺 LAN 用）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /metadata.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calvin1012.ddns.net;

    ssl_certificate     /etc/nginx/certs/calvin1012.ddns.net.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/calvin1012.ddns.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /app/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /metadata.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
