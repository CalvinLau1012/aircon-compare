# aircon-compare 容器內 nginx 設定（模板）
# 自建部署：預設只提供 HTTP :80 直接服務；如需 HTTPS／自訂域名，
# 請按你嘅環境加 server block 及證書路徑（私人設定應只放本機 gitignored notes）。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /app/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /metadata.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
