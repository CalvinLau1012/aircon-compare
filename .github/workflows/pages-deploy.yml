name: Pages 部署（Actions）

# GitHub Actions 統一部署（D2-A）
# - PR 只跑 build／完整 gates，永不 deploy；
# - master push 先由 build job 建立受驗證 artifact，deploy job needs 咗 build 才部署；
# - Pages artifact 只包含 deploy_payload.json 明確列出嘅公開檔案。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-actions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取出代碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0  # D4-A：history audit 要掃描全部 reachable refs

      - name: 設定 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 安裝 Chromium（瀏覽器 gates）
        run: playwright install chromium --with-deps

      - name: 完整本機 gates（7 gates）
        run: |
          python scripts/run_acceptance.py \
            --report "$RUNNER_TEMP/pages-acceptance.json" \
            --log-dir "$RUNNER_TEMP/acceptance-logs"

      - name: 全 Git 歷史秘密審計（D4-A；credential 必須 0）
        run: |
          python scripts/check_public_history.py --all-refs \
            --report "$RUNNER_TEMP/history-audit.json"

      - name: 驗證 Pages artifact（PR 只驗證，不部署）
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        run: |
          python scripts/build_pages_artifact.py \
            --repo . --check-only --out "$RUNNER_TEMP/pages-site" \
            --report "$RUNNER_TEMP/pages-artifact.json"

      - name: 建立 Pages artifact（master push）
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          python scripts/build_pages_artifact.py \
            --repo . --manifest deploy_payload.json --out _site \
            --report "$RUNNER_TEMP/pages-artifact.json"

      - name: 配置 Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: 上載 Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    # PR 永不 deploy；只有 master push 且 build／gates 全過才入 deploy job。
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
