name: Pages 部署（Actions）

# GitHub Actions 統一部署（D2-A）
# - PR 只跑完整 gates + 隔離 fixture 封包／HTTP／瀏覽器驗證，永不 deploy；
# - master push／master workflow_dispatch／每日成功 run dispatch（repository_dispatch）
#   先由 build job 建立受驗證 artifact，deploy job needs 咗 build 才部署；
# - repository_dispatch 只接受完整 40-hex commit + 已驗證成功 source run（run id／
#   attempt／workflow path／direct parent／metadata binding），唔會 fallback 最新 master。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:  # 只有 ref == refs/heads/master 才會入 production 路徑
  repository_dispatch:
    types: [aircon-pages-deploy]

permissions:
  contents: read

# 生產部署同 PR build 分開 concurrency group：PR 永遠唔會取消／阻塞生產，
# 生產部署亦唔會被 PR build 排隊阻住。production 組用 queue: max 保留所有
# pending run（預設 single 會以新 pending 取代舊 pending，可能犧牲已驗證部署）。
concurrency:
  group: >-
    pages-${{
      github.event_name == 'pull_request'
        && format('pr-{0}', github.event.pull_request.number)
        || 'production'
    }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    # runner 固定 ubuntu-24.04：避免浮動 latest label 於 2026-10-19 起自動轉 Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # repository_dispatch：核實來源 run 成功狀態
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      commit: ${{ steps.target.outputs.commit }}
    steps:
      - name: 解析部署目標（event／ref／payload）
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PAYLOAD_COMMIT: ${{ github.event.client_payload.commit }}
          PAYLOAD_RUN_ID: ${{ github.event.client_payload.sourceRunId }}
          PAYLOAD_RUN_ATTEMPT: ${{ github.event.client_payload.sourceRunAttempt }}
        run: |
          set -euo pipefail
          mode="check"; commit=""
          case "$EVENT_NAME" in
            push)
              if [ "$EVENT_REF" = "refs/heads/master" ]; then mode="production"; commit="$EVENT_SHA"; fi
              ;;
            workflow_dispatch)
              if [ "$EVENT_REF" = "refs/heads/master" ]; then mode="production"; commit="$EVENT_SHA"; fi
              ;;
            repository_dispatch)
              printf '%s' "$PAYLOAD_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || {
                echo "::error::repository_dispatch 缺有效 full commit"; exit 1; }
              printf '%s' "$PAYLOAD_RUN_ID" | grep -Eq '^[0-9]+$' || {
                echo "::error::repository_dispatch 缺有效 sourceRunId"; exit 1; }
              mode="production"; commit="$PAYLOAD_COMMIT"
              ;;
            pull_request) mode="check" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "部署模式：$mode（commit=${commit:-<PR check>}）"

      - name: 取出代碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.target.outputs.commit != '' && steps.target.outputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0  # D4-A history audit + master 祖先／source run 綁定

      - name: 驗證部署請求（只限 production 路徑）
        if: steps.target.outputs.mode == 'production'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_RUN_ID: ${{ github.event.client_payload.sourceRunId }}
          PAYLOAD_RUN_ATTEMPT: ${{ github.event.client_payload.sourceRunAttempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python scripts/verify_deploy_request.py \
              --event repository_dispatch \
              --commit "${{ steps.target.outputs.commit }}" \
              --source-run-id "$PAYLOAD_RUN_ID" \
              --source-run-attempt "$PAYLOAD_RUN_ATTEMPT" \
              --metadata metadata.json \
              --poll-timeout 300 --poll-interval 10 \
              --report "$RUNNER_TEMP/deploy-request.json"
          else
            python scripts/verify_deploy_request.py \
              --event "$EVENT_NAME" \
              --commit "${{ steps.target.outputs.commit }}" \
              --report "$RUNNER_TEMP/deploy-request.json"
          fi

      - name: 設定 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 安裝 Chromium（瀏覽器 gates）
        run: playwright install chromium --with-deps

      - name: 完整本機 gates（7 gates）
        run: |
          python scripts/run_acceptance.py \
            --report "$RUNNER_TEMP/pages-acceptance.json" \
            --log-dir "$RUNNER_TEMP/acceptance-logs"

      - name: 全 Git 歷史秘密審計（D4-A；credential 必須 0）
        run: |
          python scripts/check_public_history.py --all-refs \
            --report "$RUNNER_TEMP/history-audit.json"

      # PR／非 master dispatch：唔可以用 repo production metadata（可能同候選 payload
      # 未同步），所以喺 repo 外 temp 用明示 fixture metadata 重建封包，再做真 HTTP +
      # 瀏覽器 runtime + PDF 重建驗證；全程不部署。
      - name: PR 隔離 fixture 封包 + HTTP／瀏覽器驗證（不部署）
        if: steps.target.outputs.mode != 'production'
        run: |
          python scripts/make_fixture_release.py \
            --repo . --out "$RUNNER_TEMP/pr-release" \
            --report "$RUNNER_TEMP/pr-fixture.json"
          python scripts/build_pages_artifact.py \
            --repo "$RUNNER_TEMP/pr-release" \
            --payload-manifest "$RUNNER_TEMP/pr-release/deploy_payload.json" \
            --envelope "$RUNNER_TEMP/pr-release/deploy_envelope.json" \
            --metadata "$RUNNER_TEMP/pr-release/metadata.json" \
            --out "$RUNNER_TEMP/pr-site" \
            --report "$RUNNER_TEMP/pr-pages-artifact.json"
          python scripts/verify_candidate.py \
            --artifacts-dir "$RUNNER_TEMP/pr-site" \
            --manifest "$RUNNER_TEMP/pr-release/deploy_payload.json" \
            --report "$RUNNER_TEMP/pr-candidate-postdeploy.json"

      - name: 建立 Pages artifact（production：payload + metadata envelope）
        if: steps.target.outputs.mode == 'production'
        run: |
          python scripts/build_pages_artifact.py \
            --repo . \
            --payload-manifest deploy_payload.json \
            --envelope deploy_envelope.json \
            --metadata metadata.json \
            --out _site --replace-sealed \
            --report "$RUNNER_TEMP/pages-artifact.json"

      - name: 配置 Pages
        if: steps.target.outputs.mode == 'production'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: 上載 Pages artifact
        if: steps.target.outputs.mode == 'production'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    # 只有 build job 判定係 production（master push／master dispatch／已驗證
    # repository_dispatch）而且 build／gates 全過，才會部署；PR 永不 deploy。
    if: needs.build.outputs.mode == 'production' && github.event_name != 'pull_request'
    needs: build
    # runner 固定 ubuntu-24.04：避免浮動 latest label 於 2026-10-19 起自動轉 Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
