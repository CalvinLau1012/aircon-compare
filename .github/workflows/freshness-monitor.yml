name: 72h 資料新鮮度監控

# D8-A：每 6 小時檢查線上 metadata 新鮮度／部署一致性；首次失敗／狀態改變才開或更新
# 單一 monitoring issue，同狀態重複時只 noop，恢復時關閉。

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master'
    # runner 固定 ubuntu-24.04：避免浮動 latest label 於 2026-10-19 起自動轉 Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 取出代碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # --repro-from-commit 要讀 deployed metadata.commit 嘅本地 git 物件

      - name: 設定 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 線上 metadata／payload hash 一致性（非瀏覽器）
        run: |
          python scripts/postdeploy_check.py \
            --expected-metadata metadata.json \
            --manifest deploy_payload.json \
            --retries 6 --no-browser \
            --repro-from-commit \
            --report "$RUNNER_TEMP/postdeploy.json"

      - name: 私人來源健康摘要（secret 配置；未配置則明確 skip，不偽造健康）
        if: always()
        env:
          AIRCON_HEALTH_SUMMARY_URL: ${{ secrets.AIRCON_HEALTH_SUMMARY_URL }}
        run: |
          python scripts/check_health_summary.py \
            --report "$RUNNER_TEMP/source-health-summary.json" \
            --max-age-hours 48

      - name: 72h freshness＋監控告警（無論上一步結果都要處理）
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRESHNESS_RUN_ID: ${{ github.run_id }}
          FRESHNESS_HEAD_SHA: ${{ github.sha }}
          FRESHNESS_EVENT: ${{ github.event_name }}
        run: |
          python scripts/freshness_issue.py \
            --run-id "$FRESHNESS_RUN_ID" --head "$FRESHNESS_HEAD_SHA" --event "$FRESHNESS_EVENT" \
            --metadata-url 'https://calvinlau1012.github.io/aircon-compare/metadata.json' \
            --repo "$GITHUB_REPOSITORY" \
            --postdeploy-report "$RUNNER_TEMP/postdeploy.json" \
            --health-report "$RUNNER_TEMP/source-health-summary.json" \
            --report "$RUNNER_TEMP/freshness-monitor.json"

      - name: 綁定 monitor report identity（always）
        if: always()
        env:
          MONITOR_RUN_ID: ${{ github.run_id }}
          MONITOR_HEAD_SHA: ${{ github.sha }}
          MONITOR_EVENT: ${{ github.event_name }}
        run: |
          python scripts/bind_run_identity.py \
            --report "$RUNNER_TEMP/freshness-monitor.json" \
            --report "$RUNNER_TEMP/source-health-summary.json" \
            --run-id "$MONITOR_RUN_ID" --head "$MONITOR_HEAD_SHA" --event "$MONITOR_EVENT"

      - name: 上載 monitor 安全報告（always）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: freshness-monitor-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/freshness-monitor.json
            ${{ runner.temp }}/source-health-summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Monitor 人可讀摘要（always；safe allowlist）
        if: always()
        run: |
          python scripts/render_monitor_summary.py "$RUNNER_TEMP/freshness-monitor.json" >> "$GITHUB_STEP_SUMMARY" || true
