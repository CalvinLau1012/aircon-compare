name: 每日偵測 · 新機分批更新

on:
  schedule:
    # 每日香港時間 00:30（UTC 16:30）輕量偵測；有新機先觸發分批更新
    - cron: '30 16 * * *'
  # 亦可以喺 GitHub Actions 頁面手動觸發
  workflow_dispatch: {}

# 安全：只授予寫內容嘅最低權限，唔需要任何密鑰/Token
permissions:
  contents: write

# 防止重疊執行
concurrency:
  group: weekly-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取出代碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝依賴
        run: pip install -r requirements.txt

      # 每日輕量偵測：EMSD 官方資料庫 + 新機 diff（有新機自動入隊列）
      - name: 抓取 EMSD + 新機偵測
        run: python fetch_emsd.py
        continue-on-error: true

      - name: 讀取更新階段
        id: stage
        run: |
          STAGE=$(python -c "import json;print(json.load(open('update_queue.json',encoding='utf-8')).get('stage',0))" 2>/dev/null || echo 0)
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "今日批次階段：$STAGE"

      # 新機後第 1 日：官網核實第一批（Panasonic/HITACHI/COMFEE + 信興 + 樂信網店）
      - name: 官網核實第一批
        if: steps.stage.outputs.stage == '1'
        run: |
          python fetch_official.py || true
          python fetch_shew.py || true
          python fetch_rasonic.py || true
          python advance_queue.py

      # 新機後第 2 日：官網核實第二批（世紀開利 + 珍寶 + 規格）
      - name: 官網核實第二批
        if: steps.stage.outputs.stage == '2'
        run: |
          python fetch_carrier.py || true
          python fetch_general.py || true
          python fetch_specs.py || true
          python advance_queue.py

      # 價錢快照分批更新：有新機時每月最多一次，分 7 日分批進行
      - name: 價錢快照分批更新（每月一次·分七日）
        run: |
          if python -c "import sys; from fetch_prices import price_batch_active; sys.exit(0 if price_batch_active() else 1)"; then
            python fetch_prices.py --price-batch || true
          else
            echo "價錢批次未啟動，跳過"
          fi

      - name: 數據驗證（防壞數據上線）
        run: python validate_data.py

      - name: 重新生成網頁
        run: |
          python generate_html.py
          cp 空調對比報告.html index.html

      - name: 提交並推送（有變更先提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變更，跳過提交"
          else
            git commit -m "自動更新：新機偵測及規格同步（$(date -u +%F)）"
            git push || { git pull --rebase && git push; }
          fi
