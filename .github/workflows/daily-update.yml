name: 每日自動更新數據

on:
  schedule:
    # 香港時間每日 00:30（UTC 16:30）自動執行
    - cron: '30 16 * * *'
  # 亦可以喺 GitHub Actions 頁面手動觸發
  workflow_dispatch: {}

# 安全：只授予寫內容嘅最低權限，唔需要任何密鑰/Token
permissions:
  contents: write

# 防止重疊執行
concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出代碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝依賴
        run: pip install -r requirements.txt

      - name: 抓取 EMSD 官方資料庫
        run: python fetch_emsd.py
        continue-on-error: true

      - name: 抓取 Price.com.hk 實價
        run: python fetch_prices.py
        continue-on-error: true

      - name: 抓取品牌官網/官方網店規格
        run: |
          python fetch_official.py || true
          python fetch_shew.py || true
          python fetch_carrier.py || true
          python fetch_general.py || true
          python fetch_rasonic.py || true
          python fetch_specs.py || true

      - name: 數據驗證（防壞數據上線）
        run: python validate_data.py

      - name: 重新生成網頁
        run: |
          python generate_html.py
          cp 空調對比報告.html index.html

      - name: 提交並推送（有變更先提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變更，跳過提交"
          else
            git commit -m "自動更新：每日數據同步（$(date -u +%F)）"
            git push
          fi
