name: 每日自動更新數據

on:
  schedule:
    # 香港時間每日 00:30（UTC 16:30）自動執行
    - cron: '30 16 * * *'
  # 亦可以喺 GitHub Actions 頁面手動觸發
  workflow_dispatch: {}

# 安全：只授予寫內容嘅最低權限，唔需要任何密鑰/Token
permissions:
  contents: write

# 防止重疊執行
concurrency:
  group: daily-update
  cancel-in-progress: true

jobs:
  # 先偵測今日係「全量日」（每週一次）定「每日補缺」，再決定用邊條超時策略
  detect:
    name: 偵測刷新模式
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: 取出代碼
        uses: actions/checkout@v4
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 判斷全量定補缺
        id: mode
        run: |
          MODE=$(python -c "from fetch_prices import detect_mode; print(detect_mode())")
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "今日模式：$MODE"

  # 全量日：全量抓取 + 全量鏈接驗證（超時策略喺可重用工作流內部：150 分鐘）
  full-refresh:
    name: 全量刷新
    needs: detect
    if: needs.detect.outputs.mode == 'full'
    uses: ./.github/workflows/update-data.yml
    with:
      mode: full

  # 每日補缺：補缺抓取 + 分批鏈接驗證（超時策略：30 分鐘）
  daily-refresh:
    name: 每日補缺
    needs: detect
    if: needs.detect.outputs.mode == 'daily'
    uses: ./.github/workflows/update-data.yml
    with:
      mode: daily

  # 冷卻期：被限流後 48 小時內自動跳過，等官方解除限流先再執行
  cooldown:
    name: 冷卻期跳過
    needs: detect
    if: needs.detect.outputs.mode == 'cooldown'
    runs-on: ubuntu-latest
    steps:
      - name: 冷卻中
        run: echo "Price.com.hk 限流冷卻中，48 小時後自動恢復執行"
