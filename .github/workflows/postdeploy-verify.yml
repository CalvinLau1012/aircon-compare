name: 部署後核對（GATE-08）

# 唯讀核對 workflow：
#   - production Pages deploy 成功後，由 pages-deploy.yml 用 workflow_call 同一條鏈執行；
#   - 亦保留 workflow_dispatch，俾維護者對 master 上指定 commit/ref 人手重跑；
#   - checkout 後必須核實 HEAD == 指定 commit/ref，而且係 origin/master 祖先；
#   - 只攞 contents:read、checkout persist-credentials:false；
#   - 第三方 Actions 全部固定到已核實嘅完整 commit（治理 §9.3）。
on:
  workflow_call:
    inputs:
      ref:
        description: 'Pages 已部署嘅 exact commit'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: '要核對嘅 commit/ref（留空 = 觸發 workflow 嘅 ref）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: postdeploy-verify
  cancel-in-progress: false

jobs:
  verify:
    # workflow_call 繼承 Pages caller 嘅 master ref；手動入口亦只准 master。
    if: github.ref == 'refs/heads/master'
    # runner 固定 ubuntu-24.04：避免浮動 latest label 於 2026-10-19 起自動轉 Ubuntu 26
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 取出指定部署 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0  # 核實部署 commit 係 origin/master 祖先

      - name: 核實部署 commit（HEAD == 指定值；係 master 祖先）
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            EXPECT="$(git rev-parse "$INPUT_REF"^{commit})"
          else
            EXPECT="$EVENT_SHA"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$EXPECT" ]; then
            echo "::error::checkout HEAD（$HEAD_SHA）唔等於部署 commit（$EXPECT）"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::部署 commit 唔係 origin/master 祖先，拒絕核對"
            exit 1
          fi

      - name: 設定 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝依賴
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 安裝瀏覽器（核心行為證據）
        run: playwright install chromium --with-deps

      - name: 部署後核對（線上 metadata／payload hash／PDF 內容／核心瀏覽器行為）
        run: |
          python scripts/postdeploy_check.py \
            --expected-metadata metadata.json \
            --manifest deploy_payload.json \
            --retries 6 \
            --report "$RUNNER_TEMP/postdeploy-report.json"

      - name: 保存核對報告（中間產物；長期資產由 release 歸檔負責）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: postdeploy-report-${{ github.run_id }}
          path: ${{ runner.temp }}/postdeploy-report.json
          retention-days: 30
          if-no-files-found: warn
